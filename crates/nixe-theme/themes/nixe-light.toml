# Nixe Light: the light counterpart of Nixe Dark.
# Copy to ~/.config/nixe/themes/nixe-light.toml and keep only the keys to change.
name = "Nixe Light"
light = true

# Core colours
bg = "#f7f7f8"
surface = "#ffffff"
text = "#18181b"
dim_text = "#5a5a64"
accent = "#2f6fea"
border = "#dcdce1"
muted = "#d4d4d9"
highlight = "#ececef"
danger = "#d93a3a"
glow = "#2f6fea"
shadow = "#c8c8cd"

# Surfaces and text
panel = "#f0f0f2"
card = "#ffffff"
raised = "#ffffff"
popover = "#ffffff"
text_tertiary = "#6c6c76"
divider = "#e6e6ea"
warning = "#b7791f"
success = "#1f9e5c"

# How strongly the accent tints hovered and selected rows (0 to 1)
hover = 0.05
selection = 0.14

# Default accent per app and per section: a swatch name or a colour.
# Placeholders; each app's Accent row lets the user pick
[accents]
files = "blue"
notes = "amber"
photos = "coral"
mail = "violet"
calendar = "red"
music = "pink"
home = "green"

# Accent choices offered in each app's settings (same names in every theme)
[swatches]
blue = "#2f6fea"
violet = "#6f4de0"
pink = "#c93a7b"
red = "#d93a3a"
coral = "#d4532f"
amber = "#b7791f"
green = "#1f9e5c"
teal = "#1a8fa0"
graphite = "#5a5a64"

[sections.settings]
home = "teal"
connections = "blue"
hardware = "amber"
personalization = "violet"
desktop = "pink"
input = "coral"
accounts = "green"
assistant = "teal"
system = "red"

[font]
ui = "Inter"
mono = "JetBrains Mono"
weight = 400
heading_weight = 600

[shape]
radius_small = 7
radius_card = 11
radius_dialog = 15

[material]
surface = "solid"
see_through = false
blended = true

[icons]
pack = "nixe-icons"
# File-type icons keep their brand colours ("brand") or take the theme's ("theme")
file_colors = "brand"

# Code colours: swatch names or colours
[syntax]
keyword = "violet"
string = "green"
constant = "amber"
type = "teal"
preprocessor = "coral"
